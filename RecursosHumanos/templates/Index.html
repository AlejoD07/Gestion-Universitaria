{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'recursosHumanos/CSS/styleIndex.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Index RH</title>
</head>

<body>
    <div class="container-fluid mb-5">
        <div class="row">
            <div class="col-md-6 col-sm-12 mt-5">
                <div class="banner">
                    Area de Recursos Humanos
                </div>
            </div>
            <div class="col-md-6 col-sm-12 mt-5">

                <h3 class="mb-5 alinear-items">Bienvenido</h3>

                <form method="POST">
                    {% csrf_token %}
                    {% if error %}
                        <div class="alert alert-danger w-75 mx-auto">{{ error }}</div>
                    {% endif %}
                    <div class="d-flex flex-column align-items-center">
                        <input type="text" class="form-control mb-3 w-75" placeholder="Usuario" name="usuario" required>
                        <input type="password" class="form-control mb-3 w-75" placeholder="Contrasena" name="contrasena" required>
                    </div>
                    <div class="d-flex justify-content-center">
                        <button type="submit" class="btn btn-success alinear-items" id="inicioBoton">Ingresar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div class="container mt-5">
        <div class="col bg-danger-subtle">
            <p class="text-danger texto">Recuerda que debes de tener credenciales previas antes de ingresar;
                sÃ­ todavÃ­a, no lo has tienes comunica con el administrador.
            </p>
        </div>
    </div>
    <footer class="footer">
        <div class="alinear-items">
            <p class="m-5">Â© 2026 Recursos Humanos</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
