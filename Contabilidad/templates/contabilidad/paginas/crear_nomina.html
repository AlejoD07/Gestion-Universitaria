{% extends 'contabilidad/primary-layout.html' %}
{% block titulo %}Nueva Nómina{% endblock %}
{% block contenido %}

<h1>Nueva Nómina</h1>

<div class="formulario">
    {% if error_empleado %}
        <div class="alerta-error">{{ error_empleado }}</div>
    {% endif %}

    <form method="POST" id="nomina-form" data-buscar-empleado-url="{% url 'buscar_empleado_nomina' %}">
        {% csrf_token %}

        <div class="campo">
            <label>Cédula del empleado</label>
            <div class="grupo-busqueda">
                <input type="text" id="empleado_cedula" name="empleado_cedula" value="{{ datos_formulario.empleado_cedula }}" required>
                <button type="button" id="buscar_empleado" class="btn btn-secundario">Buscar</button>
            </div>
            <small id="empleado_mensaje" class="mensaje-ayuda">Busca la cédula registrada en Recursos Humanos.</small>
        </div>

        <div class="campo">
            <label>Nombre del empleado</label>
            <input type="text" id="empleado_nombre" name="empleado_nombre" value="{{ datos_formulario.empleado_nombre }}" readonly required>
        </div>

        <div class="campo">
            <label>Cargo</label>
            <input type="text" id="cargo" name="cargo" value="{{ datos_formulario.cargo }}" readonly required>
        </div>

        <div class="campo">
            <label>Área</label>
            <input type="text" id="area" name="area" value="{{ datos_formulario.area }}" readonly required>
        </div>

        <div class="campo">
            <label>Mes</label>
            <select name="mes" required>
                <option value="">-- Selecciona --</option>
                <option value="Enero">Enero</option>
                <option value="Febrero">Febrero</option>
                <option value="Marzo">Marzo</option>
                <option value="Abril">Abril</option>
                <option value="Mayo">Mayo</option>
                <option value="Junio">Junio</option>
                <option value="Julio">Julio</option>
                <option value="Agosto">Agosto</option>
                <option value="Septiembre">Septiembre</option>
                <option value="Octubre">Octubre</option>
                <option value="Noviembre">Noviembre</option>
                <option value="Diciembre">Diciembre</option>
            </select>
        </div>

        <div class="campo">
            <label>Año</label>
            <input type="number" name="anio" value="{% if datos_formulario.anio %}{{ datos_formulario.anio }}{% else %}2026{% endif %}" required>
        </div>

        <div class="campo">
            <label>Salario base</label>
            <input type="number" id="salario_base" name="salario_base" value="{{ datos_formulario.salario_base }}" step="0.01" required>
        </div>

        <div class="campo">
            <label>Horas extras</label>
            <input type="number" id="horas_extras" name="horas_extras" step="0.01" value="{% if datos_formulario.horas_extras %}{{ datos_formulario.horas_extras }}{% else %}0{% endif %}">
        </div>

        <div class="campo">
            <label>Comisiones</label>
            <input type="number" id="comisiones" name="comisiones" step="0.01" value="{% if datos_formulario.comisiones %}{{ datos_formulario.comisiones }}{% else %}0{% endif %}">
        </div>

        <div class="campo">
            <label>Deducciones</label>
            <input type="number" id="deducciones" name="deducciones" step="0.01" value="{% if datos_formulario.deducciones %}{{ datos_formulario.deducciones }}{% else %}0{% endif %}">
        </div>

        <div class="campo">
            <label>Total calculado</label>
            <p id="total_calculado" style="font-size: 18px; font-weight: bold; color: #2980b9;">$ 0</p>
        </div>

        <div class="campo">
            <label>Fecha de pago</label>
            <input type="date" name="fecha_pago" value="{{ datos_formulario.fecha_pago }}" required>
        </div>

        <div class="campo">
            <label>Estado</label>
            <select name="estado">
                <option value="pendiente">Pendiente</option>
                <option value="pagado">Pagado</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primario">Guardar</button>
        <a href="{% url 'lista_nominas' %}" class="btn btn-secundario">Cancelar</a>
    </form>
</div>

{% endblock %}
