{% extends 'contabilidad/primary-layout.html' %}
{% block titulo %}Crear plan presupuestal{% endblock %}
{% block contenido %}

<h1>Crear plan presupuestal anual</h1>

<div class="formulario">
    <form method="post">
        {% csrf_token %}
        <div class="campo">
            <label>Nombre</label>
            <input type="text" name="nombre" value="Presupuesto Institucional 2026" required>
        </div>
        <div class="campo">
            <label>Ano</label>
            <input type="number" name="anio" value="2026" required>
        </div>
        <div class="campo">
            <label>Estado</label>
            <select name="estado">
                <option value="borrador">Borrador</option>
                <option value="aprobado">Aprobado</option>
                <option value="ejecucion" selected>En ejecucion</option>
                <option value="cerrado">Cerrado</option>
            </select>
        </div>
        <div class="campo">
            <label>Fecha aprobacion</label>
            <input type="date" name="fecha_aprobacion">
        </div>
        <div class="campo">
            <label>Descripcion</label>
            <textarea name="descripcion" rows="3">Plan anual aprobado para seguimiento presupuestal.</textarea>
        </div>
        <button type="submit" class="btn btn-primario">Crear plan</button>
        <a href="{% url 'lista_presupuestos' %}" class="btn btn-secundario">Cancelar</a>
    </form>
</div>

{% endblock %}
